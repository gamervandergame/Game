<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jump Dash</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-wrapper">
    <header>
      <h1>Jump Dash</h1>
      <p class="instructions">Press Space, W, or the Up Arrow to jump. Avoid the obstacles!</p>
    </header>
    <canvas id="game" width="640" height="360" aria-label="Jumping game canvas"></canvas>
    <section class="hud" aria-live="polite">
      <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
      <div class="stat"><span class="label">Best</span><span id="best-score">0</span></div>
      <button id="restart" type="button" class="hidden" aria-label="Restart the game">Restart</button>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
